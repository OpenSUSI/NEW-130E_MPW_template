# ==============================================================================
# Padframe Pin Order Configuration (constraints/pin_order.cfg)
# Format: <PAD_NAME>  <EDGE>  <SIGNAL_OR_NET>  <DIRECTION>
#   DIRECTION: IN | OUT | POWER | UNUSED
# Active Padframe: TR-1um OSS_FRAME_GIO (16 pads: P1..P16, P8=VSS, P16=VDD)
# ==============================================================================

# North Edge
P1   N  clk          IN
P2   N  op[0]        IN
P15  N  op[1]        IN
P16  N  VDD          POWER

# West Edge
P3   W  in_data[3]   IN
P4   W  in_data[2]   IN
P5   W  in_data[1]   IN
P6   W  in_data[0]   IN

# South Edge
P7   S  rst_n        IN
P8   S  VSS          POWER
P9   S  en           IN
P10  S  carry        OUT

# East Edge
P11  E  out_data[0]  OUT
P12  E  out_data[1]  OUT
P13  E  out_data[2]  OUT
P14  E  out_data[3]  OUT
